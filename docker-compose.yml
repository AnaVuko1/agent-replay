version: '3.8'

services:
  agent-replay:
    build: .
    container_name: agent-replay
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/agent_replay.db
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-development-secret-key}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=["http://localhost:8000", "http://localhost:3000"]
      - ENABLE_WEBSOCKETS=true
      - MAX_CONTEXT_SNAPSHOT_SIZE=10000
      - ENABLE_SEED_DATA=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agent-replay-network

networks:
  agent-replay-network:
    driver: bridge